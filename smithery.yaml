# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml
startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - kaseyaVsaTenantUrl
    properties:
      kaseyaVsaTenantUrl:
        type: string
        description: Full base URL including /api/v1.0 (e.g. https://vsa.example.com/api/v1.0)
      kaseyaVsaUsername:
        type: string
        description: Local-auth username (omit if using Kaseya One token)
      kaseyaVsaPassword:
        type: string
        description: Local-auth password (omit if using Kaseya One token)
      kaseyaVsaK1Token:
        type: string
        description: Kaseya One SSO token (alternative to username + password)
  commandFunction: |-
    (config) => ({ command: 'node', args: ['dist/index.js'], env: { KASEYA_VSA_TENANT_URL: config.kaseyaVsaTenantUrl, KASEYA_VSA_USERNAME: config.kaseyaVsaUsername, KASEYA_VSA_PASSWORD: config.kaseyaVsaPassword, KASEYA_VSA_K1_TOKEN: config.kaseyaVsaK1Token, MCP_TRANSPORT: 'stdio' } })
